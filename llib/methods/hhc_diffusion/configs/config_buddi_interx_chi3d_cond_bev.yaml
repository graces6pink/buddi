# InterX (six views) + CHI3D mixed training, BEV-conditioned BUDDI.
#
# Layered on top of config_buddi_v02_cond_bev.yaml, which is left untouched:
#
#   python llib/methods/hhc_diffusion/main.py \
#     --exp-cfg llib/methods/hhc_diffusion/configs/config_buddi_v02_cond_bev.yaml \
#               llib/methods/hhc_diffusion/configs/config_buddi_interx_chi3d_cond_bev.yaml \
#     --exp-opts logging.base_folder=demo/diffusion/training \
#                logging.run=interx6_chi3d_cond_bev logging.logger=tensorboard
#
# llib/defaults/main.py::merge applies each --exp-cfg in turn, and OmegaConf
# replaces lists wholesale rather than appending, so train_names/train_composition
# here override the base file's chi3d/hi4d/flickrci3ds triple outright.

batch_size: 512

training:
  # One "epoch" is now ~451 steps rather than the 167 of the single-view run, so
  # 5000 epochs would be 2.3M steps. The previous run did 3729 x 167 = 620k steps;
  # 1800 epochs is the matching compute budget here.
  max_epochs: 1800
  # Each worker forks a copy-on-write view of a ~230k-entry list; refcount churn
  # gradually turns that into real copies. 4 keeps the worst case comfortable on
  # 61GB. Raise only after watching RSS.
  num_workers: 4

logging:
  # in EPOCHS (diffusion_trainer.py:160 multiplies by steps_per_epoch). 3.0 keeps
  # validation every ~1350 steps, matching the previous run's cadence; leaving the
  # base file's 100.0 would validate only every 45k steps.
  summaries_freq: 3.0
  checkpoint_freq: 3.0

datasets:
  train_names: ['interx', 'chi3d']
  # Matches the paper's chi3d share exactly (batch 512 x 0.2 = 102 samples from a
  # ~920-sample set, i.e. ~111 passes per 1000 steps). The difference from the
  # paper is what sits next to that 20%: there it was 60% diverse in-the-wild
  # Flickr, here it is synthetic renders. Watch CHI3D val for a rebound and drop
  # to 0.15/0.1 if it appears. The sum must be exactly 1.0 -- collective.py
  # asserts on float equality, and [0.8, 0.2] happens to hold.
  train_composition: [0.8, 0.2]
  # ORDER IS SEMANTIC. diffusion_trainer.py:252-309 overwrites ckpt_metric once
  # per validation set and returns the last one, which then drives BOTH the
  # best-checkpoint choice and the LR scheduler. Both sets are still evaluated
  # and logged to TensorBoard; only the last one votes. InterX goes last because
  # it is 95% of training and the scheduler only needs a monotone signal --
  # CHI3D is the trustworthy judge, but it is judged offline by
  # eval_conditional.py where the batch size can be chosen freely.
  val_names: ['chi3d', 'interx']
  test_names: []

  interx:
    processed_data_folder: datasets/processed/InterX
    # six-view expansion. The single-view control is
    # processed_sv_stride20_oldcam.pkl, NOT processed.pkl -- the latter is the
    # stage-1 mocap source whose bev_* fields are still the all-zero template
    # (information_missing is False throughout, so train_module.py would not null
    # them and the model would be fed fabricated zero conditioning as if real).
    processed_fn: processed_mv.pkl
    # Keep the 23.9% of views with no usable BEV. train_module.py:519-527 nulls
    # their guidance, so they train as unconditional samples rather than being fed
    # zero-filled placeholders that look like a real (but fabricated) pose.
    allow_missing_bev: true
    # 8cm exclude list, regenerated by check_interx_penetration.py. Matches on
    # frame_key, not imgname -- see interx.py, and verify the count in V2.
    filter_penetration: true
    load_unit_glob_and_transl: false

  chi3d:
    original_data_folder: datasets/original/CHI3D
    processed_data_folder: datasets/processed/CHI3D
    image_folder: images_contact
    load_single_camera: false        # all 4 rigs, as the paper does
    load_contact_frame_only: true    # one annotated contact frame per sequence
    load_from_scratch_single_camera: false
    load_unit_glob_and_transl: false

  # Only the person swap is actually wired up for diffusion training --
  # single.py:388 leaves _augm_params (mirror/rotation/scale/noise) commented out.
  # This matches the paper: "randomly shuffle the order of people during training".
  augmentation: {use: true, swap: 0.5}
  processing: {use: false, load_image: false}

model:
  regressor:
    losses:
      pseudogt_v2v: {weight: [1000.0]}
    optimizer:
      scheduler:
        # patience counts VALIDATIONS, not epochs: 4 x checkpoint_freq(3) x 451
        # steps ~= 5400 steps of no improvement before the LR halves. The previous
        # run held 1e-4 flat for 620k steps and flattened out around step 2000.
        type: reduce_lr_on_plateau
        reduce_lr_on_plateau: {mode: min, factor: 0.5, patience: 4, min_lr: 1.0e-6}
